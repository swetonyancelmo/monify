spring:
  datasource:
    # Valores padrão só para desenvolvimento local (batem com o docker-compose.yml).
    # Em qualquer outro ambiente, defina as variáveis.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/monify_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

security:
  jwt:
    # Obrigatório: sem valor padrão de propósito. Se a variável faltar, a aplicação
    # não sobe (melhor que assinar tokens com uma chave pública). Veja o .env.example.
    secret: ${JWT_SECRET}
